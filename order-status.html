<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Order Status — Mood Store</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="css/style.css?v=4" />
<style>
  .status-shell { max-width: 620px; margin: 0 auto; padding: 48px 20px 80px; }
  .status-card { border: 1px solid var(--line); background: var(--canvas-dim); padding: 28px; margin-bottom: 20px; }
  .status-card h2 { font-family: var(--font-display); font-weight: 600; font-style: italic; font-size: 22px; margin: 0 0 4px; }
  .status-pill { display: inline-block; font-family: var(--font-label); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 10px; border-radius: 999px; background: var(--jaipuri); color: var(--canvas); margin-bottom: 14px; }
  .status-pill.paid, .status-pill.delivered { background: var(--jaipuri); }
  .status-pill.shipped { background: var(--dune); color: var(--ink); }
  .status-pill.cancelled, .status-pill.refunded { background: rgba(43,27,18,0.4); }
  .status-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .status-row:last-child { border-bottom: none; }
  .status-total { font-family: var(--font-label); font-weight: 700; font-size: 16px; }
  .status-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .status-actions a.btn { text-decoration: none; display: inline-block; }
  .state-msg { text-align: center; padding: 60px 20px; color: rgba(43,27,18,0.5); font-family: var(--font-label); font-size: 13px; }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <img src="logo-mark.svg" alt="Mood Store" class="seal" width="30" height="30" /> <span class="brand-name">Mood Store</span>
  </a>
</header>
<div class="stitch-divider"></div>

<main class="status-shell">
  <div id="statusContent">
    <p class="state-msg">Loading your order…</p>
  </div>
</main>

<footer>
  <div class="footer-trust">
    <span>🔒 Secure checkout via Cashfree</span>
    <span>💵 COD available</span>
    <span>↩️ <a href="return-request.html" style="color: inherit;">7-day returns</a></span>
  </div>
  <div class="footer-base">MOOD STORE — JAIPUR, INDIA · SUPPORT@MOODSTORE.IN</div>
</footer>

<script src="js/config.js"></script>
<script>
(async function () {
  const container = document.getElementById("statusContent");
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order_id");

  if (!orderId) {
    container.innerHTML = '<p class="state-msg">No order ID was given. If you just paid, check the confirmation email for a link, or contact support with your order ID.</p>';
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-order-status?order_id=${encodeURIComponent(orderId)}`);
    const data = await res.json();

    if (!res.ok) {
      container.innerHTML = `<p class="state-msg">${data.error || "We couldn't find that order."} If you believe this is a mistake, contact support@moodstore.in with your order ID: <strong>${orderId}</strong>.</p>`;
      return;
    }

    const { order, items, return_eligible, existing_return_status } = data;

    const itemRows = items
      .map(
        (i) => `
        <div class="status-row">
          <span>${escapeHtml(i.product_name)} × ${i.quantity}${i.variant_size ? ` (${escapeHtml(i.variant_size)})` : ""}</span>
          <span>₹${Number(i.line_total_inr).toLocaleString("en-IN")}</span>
        </div>`,
      )
      .join("");

    let returnBlock = "";
    if (return_eligible) {
      returnBlock = `<div class="status-actions"><a class="btn btn-dark" href="return-request.html?order_id=${encodeURIComponent(orderId)}">Request a return</a></div>`;
    } else if (existing_return_status) {
      returnBlock = `<p style="font-size:13px; color: rgba(43,27,18,0.6);">Return status: <strong>${escapeHtml(existing_return_status)}</strong></p>`;
    }

    container.innerHTML = `
      <div class="status-card">
        <span class="status-pill ${escapeHtml(order.status)}">${escapeHtml(order.status)}</span>
        <h2>Thank you, ${escapeHtml(order.customer_name)}</h2>
        <p style="font-size: 13px; color: rgba(43,27,18,0.6); margin: 0 0 18px;">Order ${escapeHtml(order.cashfree_order_id)} · placed ${new Date(order.created_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })}</p>

        ${itemRows}

        <div class="status-row"><span>Subtotal</span><span>₹${Number(order.subtotal_inr).toLocaleString("en-IN")}</span></div>
        <div class="status-row"><span>Shipping</span><span>${Number(order.shipping_inr) === 0 ? "Free" : "₹" + Number(order.shipping_inr).toLocaleString("en-IN")}</span></div>
        ${Number(order.discount_inr) > 0 ? `<div class="status-row"><span>Discount${order.coupon_code ? ` (${escapeHtml(order.coupon_code)})` : ""}</span><span>−₹${Number(order.discount_inr).toLocaleString("en-IN")}</span></div>` : ""}
        <div class="status-row status-total"><span>Total</span><span>₹${Number(order.total_inr).toLocaleString("en-IN")}</span></div>

        ${
          order.tracking_number
            ? `<p style="font-size:13px; margin-top:14px;">Tracking: <strong>${escapeHtml(order.tracking_carrier || "")} ${escapeHtml(order.tracking_number)}</strong></p>`
            : ""
        }

        ${returnBlock}
      </div>
      <p style="font-size:12px; color: rgba(43,27,18,0.5); text-align:center;">Questions about this order? Email support@moodstore.in with your order ID.</p>
    `;
  } catch (err) {
    container.innerHTML = `<p class="state-msg">Something went wrong loading your order. Contact support@moodstore.in with your order ID: <strong>${orderId}</strong>.</p>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
