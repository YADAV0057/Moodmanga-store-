<!--
  BLOG POST TEMPLATE — for automated generation.

  This is not a live page — it's the pattern your LLM script should
  fill in and save as blog/<slug>.html for each real post, the same
  way generate-product-pages.mjs does for products.

  Replace every {{PLACEHOLDER}} below. Do not leave any unfilled —
  they'll show up literally on the page if missed.

  {{TITLE}}            — post title, plain text (also reused in <title>, OG, JSON-LD)
  {{META_DESCRIPTION}}  — 1-2 sentences, under ~160 characters, for SEO
  {{SLUG}}              — URL-safe filename without .html, e.g. "how-to-style-a-bandhani-dupatta"
  {{PUBLISH_DATE_ISO}}  — e.g. "2026-09-15" (used in schema + visible date)
  {{PUBLISH_DATE_HUMAN}}— e.g. "September 15, 2026" (visible date)
  {{READ_TIME}}         — e.g. "4 min read"
  {{TAG}}               — one category label, e.g. "STYLING GUIDE", "CRAFT NOTES"
  {{HERO_IMAGE_URL}}    — full https:// URL to a real photo (falls back to gradient block if omitted — see note below)
  {{HERO_IMAGE_ALT}}    — descriptive alt text for the hero image
  {{BODY_HTML}}         — the article body as HTML (use <p>, <h2>, <h3>, <ul>/<li> — do not include <h1>, that's the title above)

  Keep every post grounded in real product/brand facts. Do not
  fabricate customer stories, reviews, or specific claims (fabric
  performance stats, "customers say," etc.) that aren't true yet —
  same rule the rest of this site follows.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<title>{{TITLE}} | Mood Store Journal</title>
<meta name="description" content="{{META_DESCRIPTION}}" />
<link rel="canonical" href="https://moodmanga.in/blog/{{SLUG}}.html" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="Mood Store" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{META_DESCRIPTION}}" />
<meta property="og:url" content="https://moodmanga.in/blog/{{SLUG}}.html" />
<meta property="og:image" content="{{HERO_IMAGE_URL}}" />
<meta property="article:published_time" content="{{PUBLISH_DATE_ISO}}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITLE}}" />
<meta name="twitter:description" content="{{META_DESCRIPTION}}" />
<meta name="twitter:image" content="{{HERO_IMAGE_URL}}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="../css/style.css?v=3" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{TITLE}}",
  "description": "{{META_DESCRIPTION}}",
  "datePublished": "{{PUBLISH_DATE_ISO}}",
  "image": "{{HERO_IMAGE_URL}}",
  "author": { "@type": "Organization", "name": "Mood Store" },
  "publisher": { "@type": "Organization", "name": "Mood Store", "logo": "https://moodmanga.in/logo-mark.svg" },
  "mainEntityOfPage": "https://moodmanga.in/blog/{{SLUG}}.html"
}
</script>
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
  {"@type":"ListItem","position":1,"name":"Home","item":"https://moodmanga.in/index.html"},
  {"@type":"ListItem","position":2,"name":"Journal","item":"https://moodmanga.in/blog/"},
  {"@type":"ListItem","position":3,"name":"{{TITLE}}","item":"https://moodmanga.in/blog/{{SLUG}}.html"}
]}
</script>

<style>
  .post-hero { padding: 40px 28px 0; max-width: 720px; margin: 0 auto; }
  .post-hero .breadcrumb { font-family: var(--font-label); font-size: 11px; color: rgba(43,27,18,0.55); margin-bottom: 14px; }
  .post-hero .breadcrumb a { color: inherit; }
  .post-hero .tag { font-family: var(--font-label); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--rani); }
  .post-hero h1 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: clamp(28px, 4vw, 42px); margin: 10px 0 12px; }
  .post-hero .meta { font-family: var(--font-label); font-size: 12px; color: rgba(43,27,18,0.55); margin-bottom: 24px; }
  .post-hero-image { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: linear-gradient(135deg, var(--haveli), var(--dune)); }

  .post-body { max-width: 680px; margin: 0 auto; padding: 32px 28px 64px; font-size: 16px; line-height: 1.7; color: var(--ink); }
  .post-body h2 { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 24px; margin: 32px 0 12px; }
  .post-body h3 { font-family: var(--font-label); font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 10px; }
  .post-body p { margin: 0 0 16px; }
  .post-body ul { margin: 0 0 16px; padding-left: 20px; }
  .post-body li { margin-bottom: 6px; }
  .post-body a { color: var(--jaipuri); }

  .post-cta { max-width: 680px; margin: 0 auto 64px; padding: 0 28px; }
  .post-cta a { display: inline-block; background: var(--rani); color: var(--canvas); text-decoration: none; padding: 12px 24px; font-family: var(--font-label); font-size: 13px; letter-spacing: 0.5px; }

  @media (max-width: 600px) {
    .post-hero, .post-body, .post-cta { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="../index.html" class="brand">
    <img src="../logo-mark.svg" alt="Mood Store" class="seal" width="30" height="30" /> <span class="brand-name">Mood Store</span>
  </a>
  <div class="header-actions">
    <a href="../index.html" class="icon-btn" style="text-decoration:none;">Shop</a>
  </div>
</header>

<article>
  <div class="post-hero">
    <nav class="breadcrumb"><a href="../index.html">Home</a> / <a href="./index.html">Journal</a> / {{TITLE}}</nav>
    <span class="tag">{{TAG}}</span>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{PUBLISH_DATE_HUMAN}} · {{READ_TIME}}</div>
  </div>

  <img class="post-hero-image" src="{{HERO_IMAGE_URL}}" alt="{{HERO_IMAGE_ALT}}" />

  <div class="post-body">
    {{BODY_HTML}}
  </div>

  <div class="post-cta">
    <a href="../index.html">Shop the collection →</a>
  </div>
</article>

<footer>
  <div class="footer-trust">
    <span>🔒 Secure checkout via Cashfree</span>
    <span>💵 COD available</span>
    <span>↩️ 7-day returns</span>
  </div>
  <div class="footer-base">MOOD STORE — JAIPUR, INDIA · SUPPORT@MOODSTORE.IN</div>
</footer>

</body>
</html>
