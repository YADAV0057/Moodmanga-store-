# .github/workflows/generate-product-pages.yml
#
# Regenerates static /product/<slug>.html pages from Supabase and commits
# them back to the repo whenever you push to main, or once a day on a
# schedule (in case products.js/admin edits happen without a push here).

name: Generate product pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # daily, off-peak
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate product pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: https://yadav0057.github.io/Moodmanga-store-
        run: node scripts/generate-product-pages.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product/ sitemap-products.xml
          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "chore: regenerate product pages [skip ci]"

          # Someone (or another run) may have pushed to main while this job
          # was generating pages. Rebase our commit on top of the latest
          # main before pushing, retrying a few times in case of races.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed successfully."
                exit 0
              fi
            else
              git rebase --abort
            fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done

          echo "Failed to push after retries."
          exit 1
